<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container-fluid text-center">
        <div class="row">
            <div class="col bg-primary text-white mb-3"> <!-- m = margin, t = top, b = bottom -->
                <h1>formulário consumindo API ViaCep</h1>
            </div>
        </div>
        <div class="row">
            <div class="col-3">

            </div>
            <div class="col-6 border">
                <h2>Formulário</h2>

                <form method="post">
                    <div class="mb-1">
                        <label for="cep" class="form-control">CEP:</label>
                        <input type="text" name="cep">
                    </div>
                    <div class="mb-1">
                        <label for="cidade" class="form-control">CIDADE:</label>
                        <input type="text" name="cidade">
                    </div>
                    <div class="mb-1">
                        <label for="bairro" class="form-control">BAIRRO:</label>
                        <input type="text" name="bairro">
                    </div>
                    <div class="mb-1">
                        <label for="rua" class="form-control">RUA:</label>
                        <input type="text" name="rua">
                    </div>
                    <div class="mb-1">
                        <label for="numero" class="form-control">NÚMERO:</label>
                        <input type="text" name="numero">
                    </div>
                    <div class="mb-1">
                        <label for="estado" class="form-control">ESTADO:</label>
                        <input type="text" name="estado">
                    </div>
                    <input type="submit" value="Enviar" class="btn btn-success">
                </form>
            </div>
            <div class="col-3">

            </div>
        </div>
    </div>



</body>

</html>
